{{- include "harvest.validate" . -}}
{{- if .Values.monitoring.scrape.adminSD.enabled -}}
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: {{ include "harvest.fullname" $ }}-admin-http-sd
  labels:
    {{- include "harvest.labels" $ | nindent 4 }}
    app.kubernetes.io/component: admin
    {{- with .Values.monitoring.scrape.adminSD.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # The instance label is the poller name, so it stays the same when the pod IP changes.
  relabelings:
    - sourceLabels: [__meta_poller]
      targetLabel: instance
  httpSDConfigs:
    - url: {{ include "harvest.adminSDURL" . | quote }}
      {{- with .Values.monitoring.scrape.adminSD.httpSDConfig }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
