{{- /* One custom.yaml ConfigMap per (poller, collectorType) from
       harvestConfig.Pollers.<name>.collectorsExtensions. */ -}}
{{- include "harvest.validate" . -}}
{{- $root := . -}}
{{- range $pollerName, $poller := (.Values.harvestConfig.Pollers | default dict) }}
{{- $exts := ($poller.collectorsExtensions | default dict) }}
{{- range $collectorType, $ext := $exts }}
{{- if $ext }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harvest.pollerFullName" (dict "root" $root "name" $pollerName) }}-{{ lower $collectorType }}-custom
  labels:
    {{- include "harvest.labels" $root | nindent 4 }}
    app.kubernetes.io/component: poller-{{ include "harvest.pollerSlug" $pollerName }}
data:
  custom.yaml: |
    {{- toYaml $ext | nindent 4 }}
---
{{- end }}
{{- end }}
{{- end }}
