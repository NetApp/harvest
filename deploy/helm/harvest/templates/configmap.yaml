{{- /* Render harvest.yml into a ConfigMap (skipped when config.existingConfigMap is set).
       See harvest.config.effective in _config.tpl for what is stripped and injected. */ -}}
{{- include "harvest.validate" . -}}
{{- if not .Values.config.existingConfigMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harvest.configMapName" . }}
  labels: {{- include "harvest.labels" $ | nindent 4 }}
data:
  harvest.yml: |
    {{- include "harvest.config.effective" . | nindent 4 }}
{{- end }}
