name: Build and make ci

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: read environment file
        run: cat .harvest.env >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # The root module is vendored, but cmd/tools/grafana/promqlfmt is a
          # separate module whose Prometheus dependency TestFormatedPromQL builds.
          # Cache the module and build caches so that is not re-downloaded and
          # re-compiled on every run.
          cache: true
          cache-dependency-path: cmd/tools/grafana/promqlfmt/go.sum

      - name: Makefile ci
        run: |
          make ci