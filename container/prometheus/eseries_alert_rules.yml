# Harvest E-Series MEL alerts

groups:
  - name: Harvest E-Series MEL Alert
    rules:
      - alert: Synth Drv PFA
        expr: last_over_time(eseries_mel_events{event_type="4126"}[5m]) > 0
        labels:
          severity: >
            {{- if $labels.severity -}}
            {{- if eq $labels.severity "emergency" -}}
            critical
            {{- else if eq $labels.severity "alert" -}}
            critical
            {{- else if eq $labels.severity "error" -}}
            warning
            {{- else if eq $labels.severity "notice" -}}
            info
            {{- else if eq $labels.severity "informational" -}}
            info
            {{- else if eq $labels.severity "debug" -}}
            info
            {{- else if eq $labels.severity "default" -}}
            info
            {{- else if eq $labels.severity "unknown" -}}
            info
            {{- else -}}
            {{ $labels.severity }}
            {{- end -}}
            {{- end -}}
        annotations:
          summary: "Synth Drv PFA on drive at {{ $labels.location }} on array {{ $labels.array }} (chassis {{ $labels.chassis_serial }})."
          impact: "Protection"
          runbook: "https://netapp.github.io/harvest/nightly/resources/eseries-alert-runbook/#synth-drv-pfa"

