        Template: conf/eseriesperf/11.80.0/volume.yaml

  - Name: eseries_volume_read_cache_hit_ratio
    Description: Volume read cache hit ratio calculated from read hit operations and total read operations
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: Harvest Generated
        Template: conf/eseriesperf/11.80.0/volume.yaml (CacheHitRatio plugin)

  - Name: eseries_volume_write_cache_hit_ratio
    Description: Volume write cache hit ratio calculated from write hit operations and total write operations
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: Harvest Generated
        Template: conf/eseriesperf/11.80.0/volume.yaml (CacheHitRatio plugin)

  - Name: eseries_volume_total_cache_hit_ratio
    Description: Volume total cache hit ratio combining read and write cache hit operations
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: Harvest Generated
        Template: conf/eseriesperf/11.80.0/volume.yaml (CacheHitRatio plugin)

  - Name: eseries_volume_other_ops
    Description: Volume other I/O operations per second
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: otherOps
        Template: conf/eseriesperf/11.80.0/volume.yaml

  - Name: eseries_volume_queue_depth_average
    Description: Average queue depth per I/O operation
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: Harvest Generated
        Template: conf/eseriesperf/11.80.0/volume.yaml

  - Name: eseries_volume_queue_depth_max
    Description: Maximum queue depth seen over the observation window
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: queueDepthMax
        Template: conf/eseriesperf/11.80.0/volume.yaml

  # =============================================================================
  # Pool Metrics (Eseries Collector - Configuration)
  # =============================================================================
  - Name: eseries_pool_labels
    Description: This metric provides information about storage pools (volume groups and disk pools).
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: Harvest generated
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_raid_level
    Description: RAID level of the storage pool
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: raidLevel
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_status
    Description: RAID status of the storage pool
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: raidStatus
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_drive_media_type
    Description: Media type of the drives that make up the storage pool (e.g. ssd, hdd)
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: driveMediaType
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_drive_physical_type
    Description: Physical type of the drives that make up the storage pool (e.g. nvme4k)
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: drivePhysicalType
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_block_sizes_supported
    Description: Volume block sizes supported by the storage pool (e.g. 512,4096)
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: blkSizeSupported
        Template: conf/eseries/11.80.0/pool.yaml (Pool plugin)

  - Name: eseries_pool_shelf_loss_protection
    Description: Whether the storage pool is protected against the loss of an entire drive shelf/tray
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: trayLossProtection
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_security_type
    Description: Security capability type of the storage pool (e.g. capable)
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: securityType
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_security_level
    Description: Security level of the storage pool (e.g. fde)
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: securityLevel
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_da_capable
