        Template: conf/eseriesperf/11.80.0/pool.yaml

  - Name: eseries_pool_read_utilization
    Description: Percentage of the observation window the pool spent servicing read I/O
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: Harvest Generated
        Template: conf/eseriesperf/11.80.0/pool.yaml

  - Name: eseries_pool_write_utilization
    Description: Percentage of the observation window the pool spent servicing write I/O
    APIs:
      - API: REST
