    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/storage-pools
        ESeriesCounter: protectionInformationCapabilities.protectionInformationCapable
        Template: conf/eseries/11.80.0/pool.yaml

  - Name: eseries_pool_block_size
