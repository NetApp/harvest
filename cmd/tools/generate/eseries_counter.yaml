        Template: conf/eseriesperf/11.80.0/pool.yaml (CacheHitRatio plugin)

  - Name: eseries_pool_other_ops
    Description: Pool other I/O operations per second
    APIs:
      - API: REST
        Endpoint: storage-systems/{array_id}/live-statistics
        ESeriesCounter: otherOps
        Template: conf/eseriesperf/11.80.0/pool.yaml

  - Name: eseries_pool_queue_depth_average
    Description: Average queue depth per I/O operation
