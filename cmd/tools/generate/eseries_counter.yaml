        Template: conf/eseriesperf/11.80.0/pool.yaml (CacheHitRatio plugin)

  - Name: eseries_pool_write_cache_hit_ratio
    Description: Pool write cache hit ratio calculated from write hit operations and total write operations
    APIs:
      - API: REST
