
name:                     Netstat
query:                    netstat
object:                   netstat

counters:
  - ^^instance_uuid
  - ^faddr
  - ^fport_hbo                => fport
  - ^laddr
  - ^lport_hbo                => lport
  - ^node_name                => node
  - bytes_recvd
  - bytes_sent
  - cong_win
  - cong_win_th
  - ooorcv_pkts
  - recv_window
  - rexmit_pkts
  - send_window

override:
  lport_hbo: string
  fport_hbo: string

plugins:
  - LabelAgent:
    join:
      - faddr `_` faddr,fport
      - laddr `_` laddr,lport

export_options:
  instance_keys:
    - faddr
    - laddr
    - node
