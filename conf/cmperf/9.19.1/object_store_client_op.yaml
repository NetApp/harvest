
name:                     ObjectStoreClient
query:                    object_store_client_op
object:                   fabricpool

counters:
  - ^^instance_name        => fabricpool
  - average_latency
  - get_throughput_bytes
  - instance_uuid
  - node_name              => node
  - put_throughput_bytes
  - stats
  - throughput_ops

export_options:
  instance_keys:
    - fabricpool
    - node
