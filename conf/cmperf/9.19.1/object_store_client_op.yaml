
name:                     ObjectStoreClient
query:                    object_store_client_op
object:                   fabricpool

counters:
  - ^^instance_uuid
  - ^instance_name => fabricpool
  - ^node_name     => node
  - average_latency
  - get_throughput_bytes
  - put_throughput_bytes
  - stats
  - throughput_ops

export_options:
  instance_keys:
    - fabricpool
    - node
