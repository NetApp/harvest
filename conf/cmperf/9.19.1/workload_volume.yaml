# object provides counters per volume for workloads tracked via "autovol"
# (i.e. not in a policy group)

name:                     WorkloadVolume
query:                    workload_volume
object:                   qos

# recommended to use large interval, since workload objects are expensive
client_timeout: 1m30s
schedule:
  - instance: 10m
  - data: 3m

counters:
  - ^^aggregated_workload_uuid
  - ^aggregated_workload_name  => workload
  - concurrency
  - latency
  - ops
  - other_ops
  - read_data
  - read_io_type
  - read_latency
  - read_ops
  - sequential_reads
  - sequential_writes
  - total_data
  - write_data
  - write_latency
  - write_ops
override:
  - read_io_type_base: delta

qos_labels:
  - svm.name     => svm
  - volume
  - qtree
  - lun
  - file
  - policy.name  => policy_group
  - wid
  - name         => workload

export_options:
  instance_keys:
    - file
    - lun
    - policy_group
    - qtree
    - svm
    - volume
    - wid
    - workload
