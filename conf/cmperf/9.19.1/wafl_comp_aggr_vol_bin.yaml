name:                     WAFLCompBin
query:                    wafl_comp_aggr_vol_bin
object:                   fabricpool

counters:
  - ^^object_store_name       => cloud_target
  - ^^vol_name                => volume
  - ^^vserver_name            => svm
  - ^comp_aggr_name
  - ^instance_name
  - cloud_bin_op_latency_average
  - cloud_bin_operation
plugins:
  - FabricPool:
      - include_constituents: false

export_options:
  instance_keys:
    - cloud_target
    - svm
    - volume

override:
  - cloud_bin_operation: delta
